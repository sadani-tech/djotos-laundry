# Jalankan semuanya: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-djotos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-djotos_secret}
      POSTGRES_DB: ${POSTGRES_DB:-djotos}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-djotos}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-djotos}:${POSTGRES_PASSWORD:-djotos_secret}@db:5432/${POSTGRES_DB:-djotos}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-ganti-dengan-string-acak-panjang}
      WA_PROVIDER: ${WA_PROVIDER:-mock}
      FONNTE_TOKEN: ${FONNTE_TOKEN:-}
      WABLAS_BASE_URL: ${WABLAS_BASE_URL:-}
      WABLAS_TOKEN: ${WABLAS_TOKEN:-}
      WABLAS_SECRET: ${WABLAS_SECRET:-}
      WA_CLOUD_TOKEN: ${WA_CLOUD_TOKEN:-}
      WA_CLOUD_PHONE_NUMBER_ID: ${WA_CLOUD_PHONE_NUMBER_ID:-}
      SEED_OWNER_USERNAME: ${SEED_OWNER_USERNAME:-owner}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-owner123}
      CORS_ORIGIN: http://localhost:3000
      PORT: 4000
    ports: ["4000:4000"]
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    restart: unless-stopped
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  dbdata:
